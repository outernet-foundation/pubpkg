name: Publish packages
description: Run release-devkit publish-packages inside the caller's job, keeping OIDC identity local

inputs:
  config:
    description: Path to the publish config
    default: publish-config.json

runs:
  using: composite
  steps:
    - name: Fetch tags
      # Workaround: fetch-tags is broken with shallow clones
      shell: bash
      run: git fetch --tags origin

    - uses: astral-sh/setup-uv@v7

    - name: Publish
      shell: bash
      run: uvx --from release-devkit==0.1.3 publish-packages --config ${{ inputs.config }}
