[project]
name = "pubpkg"
version = "0.1.0"
description = "Publication machinery: per-package tag ledger, path-diff change detection, ephemeral version patching, and per-registry feed adapters (nuget, npm/UPM) driven by a declarative consumer-owned config"
requires-python = ">=3.13"
dependencies = [
    "bashrun",
    "stack-lifecycle",
    "unity-buildkit",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.9.1",
    "typer>=0.17.4",
]

[dependency-groups]
dev = ["basedpyright>=1.39.10", "ruff>=0.14.11", "pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
create-release = "pubpkg.create_release:app"
ensure-release-pr = "pubpkg.ensure_release_pr:app"
fetch-ci-artifacts = "pubpkg.fetch_ci_artifacts:app"
mirror-images = "pubpkg.mirror_images:app"
publish-dev = "pubpkg.publish_dev:app"
publish-packages = "pubpkg.publish_packages:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pubpkg"]
include = [
    "src/pubpkg/py.typed",
]

[tool.uv.sources]
bashrun = { git = "https://github.com/outernet-foundation/bashrun.git", rev = "1a0add1eb9e53e19245dcdda3e2018577b4e1153" }
stack-lifecycle = { git = "https://github.com/outernet-foundation/stack-lifecycle.git", rev = "8132ab66d6c6e8342d299fc4e76c8f9fe93ea2c1" }
unity-buildkit = { git = "https://github.com/outernet-foundation/unity-buildkit.git", rev = "70741126846015e001952d4465b7512c75643b2f" }

[tool.basedpyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
